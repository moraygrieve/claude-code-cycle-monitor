<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Santander Cycles Monitor</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
    header { padding:12px 20px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;
             border-bottom:1px solid #334155; }
    header h1 { font-size:18px; margin:0; }
    header .sub { color:var(--muted); font-size:13px; }
    button { margin-left:auto; background:var(--accent); color:#04293f; border:none; padding:8px 14px;
             border-radius:6px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .stats { display:flex; gap:24px; padding:10px 20px; flex-wrap:wrap; background:var(--panel); }
    .stat .num { font-size:22px; font-weight:700; }
    .stat .lbl { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    main { flex:1; display:flex; min-height:0; }
    #map { flex:1; }
    aside { width:300px; padding:16px 20px; background:var(--panel); border-left:1px solid #334155;
            overflow:auto; }
    aside h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 12px; }
    .legend { font-size:13px; line-height:1.9; }
    .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:8px; vertical-align:middle; }
    .leaflet-popup-content { font-size:13px; }
    .leaflet-popup-content b { font-size:14px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="title">Santander Cycles</h1>
      <div class="sub" id="subtitle">Loading…</div>
    </div>
    <button id="refresh">Refresh data</button>
  </header>

  <div class="stats" id="stats"></div>

  <main>
    <div id="map"></div>
    <aside>
      <h2>Bikes available per station</h2>
      <canvas id="chart" height="180"></canvas>
      <h2 style="margin-top:24px;">Map legend</h2>
      <div class="legend">
        <div><span class="dot" style="background:#ef4444"></span>0 bikes (empty)</div>
        <div><span class="dot" style="background:#f59e0b"></span>1–4 bikes</div>
        <div><span class="dot" style="background:#22c55e"></span>5+ bikes</div>
        <div><span class="dot" style="background:#64748b"></span>full (no free docks)</div>
      </div>
    </aside>
  </main>

  <script>
    const map = L.map("map").setView([51.509, -0.118], 12);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 19
    }).addTo(map);

    let markerLayer = L.layerGroup().addTo(map);
    let chart = null;

    function colorFor(s) {
      if (s.empty_slots === 0) return "#64748b";
      if (s.free_bikes === 0) return "#ef4444";
      if (s.free_bikes < 5) return "#f59e0b";
      return "#22c55e";
    }

    function stat(num, lbl) {
      return `<div class="stat"><div class="num">${num.toLocaleString()}</div><div class="lbl">${lbl}</div></div>`;
    }

    function render(data) {
      document.getElementById("title").textContent = data.name;
      document.getElementById("subtitle").textContent =
        `${data.city} · ${data.station_count} docking stations`;

      document.getElementById("stats").innerHTML =
        stat(data.station_count, "Stations") +
        stat(data.total_free_bikes, "Bikes available") +
        stat(data.total_empty_slots, "Empty docks") +
        stat(data.empty_stations, "Empty stations") +
        stat(data.full_stations, "Full stations");

      markerLayer.clearLayers();
      data.stations.forEach(s => {
        if (s.lat == null || s.lon == null) return;
        L.circleMarker([s.lat, s.lon], {
          radius: 5, color: colorFor(s), fillColor: colorFor(s), fillOpacity: .85, weight: 1
        }).bindPopup(
          `<b>${s.name}</b><br>` +
          `🚲 ${s.free_bikes} bikes &nbsp; 🅿️ ${s.empty_slots} docks<br>` +
          `capacity ${s.capacity}` + (s.ebikes != null ? ` &nbsp;·&nbsp; ${s.ebikes} e-bikes` : "")
        ).addTo(markerLayer);
      });

      renderChart(data.stations);
    }

    function renderChart(stations) {
      const buckets = ["0", "1–4", "5–9", "10–19", "20+"];
      const counts = [0, 0, 0, 0, 0];
      stations.forEach(s => {
        const b = s.free_bikes;
        if (b === 0) counts[0]++;
        else if (b < 5) counts[1]++;
        else if (b < 10) counts[2]++;
        else if (b < 20) counts[3]++;
        else counts[4]++;
      });
      const ctx = document.getElementById("chart");
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: "bar",
        data: { labels: buckets, datasets: [{ data: counts, backgroundColor: "#38bdf8" }] },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: "#94a3b8" }, grid: { display: false } },
            y: { ticks: { color: "#94a3b8" }, grid: { color: "#334155" } }
          }
        }
      });
    }

    async function load(refresh) {
      const btn = document.getElementById("refresh");
      btn.disabled = true; btn.textContent = refresh ? "Refreshing…" : "Loading…";
      try {
        const res = await fetch(refresh ? "/api/refresh" : "/api/stations",
                                { method: refresh ? "POST" : "GET" });
        render(await res.json());
      } finally {
        btn.disabled = false; btn.textContent = "Refresh data";
      }
    }

    document.getElementById("refresh").addEventListener("click", () => load(true));
    load(false);
  </script>
</body>
</html>
